<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #2d3748;
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
            position: relative;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
            padding-right: 40px;
        }

        input:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #4a5568;
            user-select: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            background: #3182ce;
        }

        .password-strength {
            font-size: 0.85rem;
            margin-top: 0.5rem;
            color: #718096;
        }

        .error {
            color: #e53e3e;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .password-match {
            font-size: 0.85rem;
            color: #48bb78;
            margin-top: 0.5rem;
            display: none;
        }

        .password-not-match {
            font-size: 0.85rem;
            color: #e53e3e;
            margin-top: 0.5rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reset Password</h1>
        <form method="POST" id="resetForm">
            {% csrf_token %}
            <div class="form-group">
                <input type="password" name="new_password" id="newPassword" 
                       placeholder="New Password" required>
                <span class="password-toggle">👁️</span>
                <div class="password-strength"></div>
            </div>
            <div class="form-group">
                <input type="password" name="confirm_password" id="confirmPassword" 
                       placeholder="Confirm Password" required>
                <span class="password-toggle">👁️</span>
                <div class="password-match">Passwords match ✓</div>
                <div class="password-not-match">Passwords do not match ✗</div>
            </div>
            <button type="submit">Reset Password</button>
        </form>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>

    <script>
        const form = document.getElementById('resetForm');
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const toggles = document.querySelectorAll('.password-toggle');
        const strengthIndicator = document.querySelector('.password-strength');
        const matchIndicator = document.querySelector('.password-match');
        const notMatchIndicator = document.querySelector('.password-not-match');

        toggles.forEach(toggle => {
            toggle.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const type = input.type === 'password' ? 'text' : 'password';
                input.type = type;
                this.textContent = type === 'password' ? '👁️' : '🔒';
            });
        });

        function checkPasswordStrength(password) {
            const hasUpper = /[A-Z]/.test(password);
            const hasLower = /[a-z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            const hasSpecial = /[!@#$%^&*]/.test(password);
            const isLongEnough = password.length >= 8;

            let strength = 0;
            strength += hasUpper ? 1 : 0;
            strength += hasLower ? 1 : 0;
            strength += hasNumber ? 1 : 0;
            strength += hasSpecial ? 1 : 0;
            strength += isLongEnough ? 1 : 0;

            return strength;
        }

        function updatePasswordStrength() {
            const strength = checkPasswordStrength(newPassword.value);
            const messages = [
                'Very weak',
                'Weak',
                'Fair',
                'Good',
                'Strong'
            ];
            const colors = [
                '#e53e3e',
                '#ed8936',
                '#ecc94b',
                '#48bb78',
                '#38a169'
            ];

            if (newPassword.value) {
                strengthIndicator.textContent = messages[strength - 1];
                strengthIndicator.style.color = colors[strength - 1];
            } else {
                strengthIndicator.textContent = '';
            }
        }

        function checkPasswordMatch() {
            if (confirmPassword.value) {
                if (newPassword.value === confirmPassword.value) {
                    matchIndicator.style.display = 'block';
                    notMatchIndicator.style.display = 'none';
                } else {
                    matchIndicator.style.display = 'none';
                    notMatchIndicator.style.display = 'block';
                }
            } else {
                matchIndicator.style.display = 'none';
                notMatchIndicator.style.display = 'none';
            }
        }

        newPassword.addEventListener('input', () => {
            updatePasswordStrength();
            checkPasswordMatch();
        });

        confirmPassword.addEventListener('input', checkPasswordMatch);

        form.addEventListener('submit', (e) => {
            if (newPassword.value !== confirmPassword.value) {
                e.preventDefault();
                alert('Passwords do not match!');
            }
        });
    </script>
</body>
</html>
